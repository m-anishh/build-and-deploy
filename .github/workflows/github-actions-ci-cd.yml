name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  AWS_REGION: eu-north-1
  EKS_CLUSTER: build-and-deploy
  K8S_NAMESPACE: production-app
  DEPLOYMENT: devops-app

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - run: npm audit --audit-level=high

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::135438495833:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Point manifests at built image
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          sed -i "s|ghcr.io/yourusername/devops-app:latest|${IMAGE}|g" \
            k8s/k8s-deployment.yaml k8s/k8s-migration-job.yaml
      - name: Apply manifests
        run: |
          # namespace, ConfigMap DB_HOST, and db-credentials Secret are managed
          # out-of-band (Terraform / External Secrets); CI role is namespace-scoped.
          kubectl apply -f k8s/k8s-rbac.yaml
          kubectl apply -f k8s/k8s-configmap.yaml
      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --namespace "$K8S_NAMESPACE" \
            --docker-server="$REGISTRY" \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount devops-app -n "$K8S_NAMESPACE" \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
      - name: Run database migrations
        run: |
          kubectl delete job db-migrate -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl apply -f k8s/k8s-migration-job.yaml
          kubectl wait --for=condition=complete job/db-migrate -n "$K8S_NAMESPACE" --timeout=180s \
            || (kubectl logs job/db-migrate -n "$K8S_NAMESPACE" --tail=100; exit 1)
      - name: Apply workload manifests
        run: |
          kubectl apply -f k8s/k8s-deployment.yaml
          kubectl apply -f k8s/k8s-service.yaml
          kubectl apply -f k8s/k8s-hpa.yaml
      - name: Wait for rollout
        run: kubectl rollout status deployment/"$DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=180s

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::135438495833:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Roll back to previous revision
        run: |
          kubectl rollout undo deployment/"$DEPLOYMENT" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/"$DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=120s

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, security, build, deploy, rollback]
    if: always()
    steps:
      - name: Build status message
        id: status
        run: |
          if [ "${{ needs.rollback.result }}" == "success" ]; then
            echo "text=Deploy failed - rolled back to previous revision" >> "$GITHUB_OUTPUT"
            echo "color=warning" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "text=Deploy failed AND rollback failed - manual intervention needed" >> "$GITHUB_OUTPUT"
            echo "color=danger" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "text=Pipeline succeeded, deployed" >> "$GITHUB_OUTPUT"
            echo "color=good" >> "$GITHUB_OUTPUT"
          else
            echo "text=Pipeline finished (test=${{ needs.test.result }}, security=${{ needs.security.result }}, build=${{ needs.build.result }})" >> "$GITHUB_OUTPUT"
            echo "color=warning" >> "$GITHUB_OUTPUT"
          fi
      - uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "text": "${{ steps.status.outputs.text }} — ${{ github.repository }}@${{ github.ref_name }} (${{ github.sha }})"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
