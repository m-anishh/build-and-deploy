# Database credentials.
#
# This is a TEMPLATE — do NOT commit real passwords. In CI/production, create
# the secret out-of-band instead, e.g. from Terraform's Secrets Manager output:
#
#   kubectl create secret generic db-credentials -n production-app \
#     --from-literal=DB_USER=appuser \
#     --from-literal=DB_PASSWORD='<from-secrets-manager>'
#
# Or manage it with the External Secrets Operator (recommended) so AWS Secrets
# Manager remains the single source of truth.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: production-app
  labels:
    app: devops-app
    component: database
type: Opaque
stringData:
  DB_USER: "appuser"
  DB_PASSWORD: "CHANGE_ME"
