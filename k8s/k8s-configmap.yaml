apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production-app
  labels:
    app: devops-app
    component: config
data:
  # Application environment variables
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  APP_VERSION: "1.0.0"
  
  # Application configuration
  app-settings.json: |
    {
      "timeout": 30000,
      "maxConnections": 100,
      "enableMetrics": true,
      "metricsInterval": 60000
    }
