apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production-app
  labels:
    app: devops-app
    component: config
data:
  # Application environment variables
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  APP_NAME: "devops-app"
  APP_VERSION: "2.0.0"

  # Database connection (non-secret parts only; credentials live in the
  # db-credentials Secret). Point DB_HOST at your RDS endpoint.
  DB_HOST: "build-and-deploy-postgres.cne6gw6g6pnx.eu-north-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  DB_SSL: "true"
  DB_POOL_MAX: "10"

  # ML anomaly-detection service (services/ml), in-cluster DNS
  ML_SERVICE_URL: "http://devops-ml:8000"

  # Application configuration
  app-settings.json: |
    {
      "timeout": 30000,
      "maxConnections": 100,
      "enableMetrics": true,
      "metricsInterval": 60000
    }
