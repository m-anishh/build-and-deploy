# Free public exposure via NodePort (no paid LoadBalancer).
# After applying, open the node security group for these ports:
#   aws ec2 authorize-security-group-ingress --group-id <node-sg> --protocol tcp --port 30080 --cidr 0.0.0.0/0
#   aws ec2 authorize-security-group-ingress --group-id <node-sg> --protocol tcp --port 30300 --cidr 0.0.0.0/0
# Reach at http://<node-external-ip>:30080 (app) and :30300 (Grafana).
# 0.0.0.0/0 = the whole internet — restrict the CIDR for anything real.
apiVersion: v1
kind: Service
metadata:
  name: devops-app-public
  namespace: production-app
  labels:
    app: devops-app
spec:
  type: NodePort
  selector:
    app: devops-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-public
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
