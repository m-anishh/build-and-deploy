apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-app
  namespace: production-app
  labels:
    app: devops-app

---
# Role for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-app
  namespace: production-app
  labels:
    app: devops-app
rules:
  # Allow reading pod information
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Allow reading configmaps in the same namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Allow reading secrets (if needed)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---
# RoleBinding to bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-app
  namespace: production-app
  labels:
    app: devops-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-app
subjects:
  - kind: ServiceAccount
    name: devops-app
    namespace: production-app
