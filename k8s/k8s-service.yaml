apiVersion: v1
kind: Service
metadata:
  name: devops-app
  namespace: production-app
  labels:
    app: devops-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # If using AWS
spec:
  type: ClusterIP
  selector:
    app: devops-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None

---
# Service for metrics scraping (if using Prometheus)
apiVersion: v1
kind: Service
metadata:
  name: devops-app-metrics
  namespace: production-app
  labels:
    app: devops-app
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: devops-app
  ports:
    - name: metrics
      port: 3000
      targetPort: http
      protocol: TCP

