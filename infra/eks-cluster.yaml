apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: build-and-deploy
  region: eu-north-1
  version: "1.30"

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
    labels:
      role: worker
    tags:
      managed-by: eksctl
      project: build-and-deploy
